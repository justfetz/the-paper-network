# Google Places (New) text search around every demand point: plant names, addresses, phones, websites.
# Needs the GOOGLE_MAPS_API_KEY repository secret (Places API (New) enabled, key restricted to that API). Resumable: a run that hits the
# project's daily SearchText quota saves what it found and the next run continues; raise the quota in the Google Cloud console to finish in one go.
name: places
on:
  workflow_dispatch:
  schedule:
    - cron: "11 16 * * *"   # daily until the list is complete; each run resumes where the daily quota stopped it and exits in seconds once done
permissions: { contents: write }
jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - name: Demand points for the search
        run: python -c "import json,pandas as pd; d=json.load(open('data/paper_network.json')); pd.DataFrame([dict(node_id=n['id'],name=n['name'],lat=n['lat'],lon=n['lon']) for n in d['nodes']]).to_csv('data/demand_nodes.csv',index=False); print(len(d['nodes']),'nodes')"
      - name: Search
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          [ -z "$GOOGLE_MAPS_API_KEY" ] && { echo "no GOOGLE_MAPS_API_KEY secret; nothing to do"; exit 0; }
          python ingest/google_places.py data/demand_nodes.csv data/plants_places.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: places-layer
          path: data/plants_places.csv
          if-no-files-found: warn
      - name: Commit
        if: always()
        run: |
          git config user.name "paper-network-bot" && git config user.email "bot@users.noreply.github.com"
          git add data/plants_places.csv data/demand_nodes.csv 2>/dev/null; git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "places: Google Places text search around demand points, $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do if git pull --rebase -X theirs -q origin main && git push; then break; fi; git rebase --abort 2>/dev/null || true; sleep 15; done
